name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses and install Android 16 SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare release upload key (optional)
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kontho-upload.jks"
            echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/kontho-upload.jks" >> "$GITHUB_ENV"
          else
            echo "No upload key configured; the release AAB will be unsigned."
          fi

      - name: Build debug APK and release bundle
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleDebug assembleRelease bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kontho-pdf-reader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kontho-pdf-reader-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB (signed only when upload-key secrets are configured)
        uses: actions/upload-artifact@v4
        with:
          name: kontho-pdf-reader-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  publish-stable-release:
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          contains(github.event.head_commit.message, '[release-stable]') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kontho-pdf-reader-release-apk
          path: release-assets

      - name: Prepare and verify stable release APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find release-assets -type f -name 'app-release.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "No signed app-release.apk was produced. Configure ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, and ANDROID_UPLOAD_KEY_PASSWORD in repository Actions secrets. Unsigned APKs are not published as stable releases." >&2
            find release-assets -type f -maxdepth 2 -print
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print -quit)"
          if [ -z "$APKSIGNER" ]; then
            echo "Could not find apksigner under $SDK_ROOT/build-tools" >&2
            exit 1
          fi
          "$APKSIGNER" verify "$apk"
          cp "$apk" "Kontho-PDF-Reader-v0.6.2.apk"
          test -s "Kontho-PDF-Reader-v0.6.2.apk"

      - name: Publish stable release to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ## Kontho PDF Reader 0.6.2

          This stable GitHub release of Kontho 0.6.2 improves in-app update downloads and preserves release signing for future updates, alongside default PDF reader support, Bangla OCR and read-aloud features.

          - Bangla, English, and Bangla + English OCR.
          - Accurate-OCR read-aloud with page-ahead scanning and optional continuous reading.
          - Configurable OCR text cache and reading-position controls.
          - Keep-screen-awake option and confirmation before stopping active continuous OCR narration from the player or reader Back action.
          - Choose Kontho as the default PDF handler on Android, and open PDFs launched from other apps.
          - Select and preview supported Bangla TTS voices available on the device; actual voice quality depends on the installed speech engine.

          **Signing and testing:** This APK is signed using the persistent Kontho release key and is published for direct GitHub installation. It is not a Google Play release. Keep the signing key backed up securely; future updates must use the same key. Bangla voice quality depends on the TTS engine and voice installed on the device. OCR accuracy varies with page quality and layout. Please test with your own PDFs before relying on it.
          NOTES

          gh release create "v0.6.2" \
            "Kontho-PDF-Reader-v0.6.2.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kontho PDF Reader 0.6.2" \
            --notes-file release-notes.md
