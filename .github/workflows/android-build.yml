name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses and install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare release upload key (optional)
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kontho-upload.jks"
            echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/kontho-upload.jks" >> "$GITHUB_ENV"
          else
            echo "No upload key configured; the release AAB will be unsigned."
          fi

      - name: Build debug APK and release bundle
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleDebug bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kontho-pdf-reader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release AAB (signed only when upload-key secrets are configured)
        uses: actions/upload-artifact@v4
        with:
          name: kontho-pdf-reader-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
