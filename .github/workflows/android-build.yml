name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses and install Android 16 SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare release upload key (optional)
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kontho-upload.jks"
            echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/kontho-upload.jks" >> "$GITHUB_ENV"
          else
            echo "No upload key configured; the release AAB will be unsigned."
          fi

      - name: Build debug APK and release bundle
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleDebug bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kontho-pdf-reader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release AAB (signed only when upload-key secrets are configured)
        uses: actions/upload-artifact@v4
        with:
          name: kontho-pdf-reader-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  publish-preview:
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          contains(github.event.head_commit.message, '[release]') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kontho-pdf-reader-debug
          path: release-assets

      - name: Prepare preview APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find release-assets -type f -name 'app-debug.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "Debug APK artifact did not contain app-debug.apk." >&2
            exit 1
          fi
          cp "$apk" "Kontho-PDF-Reader-v0.6.1-preview.1.apk"
          test -s "Kontho-PDF-Reader-v0.6.1-preview.1.apk"

      - name: Publish preview to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ## Kontho PDF Reader 0.6.1 Preview 1

          This preview updates Kontho to 0.6.1 and adds default PDF reader support alongside the existing Bangla OCR and read-aloud features.

          - Bangla, English, and Bangla + English OCR.
          - Accurate-OCR read-aloud with page-ahead scanning and optional continuous reading.
          - Configurable OCR text cache and reading-position controls.
          - Keep-screen-awake option and confirmation before stopping active continuous OCR narration from the player or reader Back action.
          - Choose Kontho as the default PDF handler on Android, and open PDFs launched from other apps.
          - Select and preview supported Bangla TTS voices available on the device; actual voice quality depends on the installed speech engine.

          **Important:** This APK is built from the Gradle debug variant and uses the debug signing key. It is intended for manual installation and testing, not for Google Play distribution. Bangla voice quality depends on the TTS engine and voice installed on the device. OCR accuracy varies with page quality and layout. The successful CI build does not replace physical-device testing.
          NOTES

          gh release create "v0.6.1-preview.1" \
            "Kontho-PDF-Reader-v0.6.0-preview.1.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kontho PDF Reader 0.6.1 Preview 1" \
            --prerelease \
            --notes-file release-notes.md
