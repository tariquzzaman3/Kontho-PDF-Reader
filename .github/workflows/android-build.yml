name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses and install Android 16 SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: "8.13"

      - name: Build debug APK and release bundle without signing secrets
        run: gradle --no-daemon clean assembleDebug bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kontho-pdf-reader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release AAB build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kontho-pdf-reader-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  publish-stable-release:
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          contains(github.event.head_commit.message, '[release-stable]') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted main-branch source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses and install Android 16 SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: "8.13"

      - name: Prepare release upload key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "The release signing key is not configured in repository Actions secrets." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kontho-upload.jks"
          test -s "$RUNNER_TEMP/kontho-upload.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/kontho-upload.jks" >> "$GITHUB_ENV"

      - name: Build and verify signed release APK
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "The signed release APK was not produced." >&2
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print -quit)"
          if [ -z "$APKSIGNER" ]; then
            echo "Could not find apksigner under $SDK_ROOT/build-tools" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$apk"
          cp "$apk" "Kontho-PDF-Reader-v0.6.6.apk"
          test -s "Kontho-PDF-Reader-v0.6.6.apk"
          sha256sum "Kontho-PDF-Reader-v0.6.6.apk" > "APK-SHA256SUMS.txt"

      - name: Publish stable release to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ## Kontho PDF Reader 0.6.6

          This update improves protected-PDF access, library cover sizing, text selection controls, and reader toolbar readability.

          ### What's new
          - Open password-protected PDFs with a password prompt. The password is kept in memory only while the document is open; older Android versions use a temporary app-private decrypted copy that is deleted when the reader closes.
          - PDF cover thumbnails now preserve their page proportions as the library changes between 2, 3, and 4 columns.
          - The extracted-text selection panel now has a visible Back action alongside Copy, Search web, and Define in browser.
          - The PDF filename uses a high-contrast theme-aware label and remains visible independently of the three-dot menu.

          ### Existing features
          - Read Bangla, English, and mixed-language PDFs with OCR.
          - Listen to selectable PDF text or OCR-recognized text using Android text-to-speech.
          - Browse PDF folders with progressive scanning, grid/list layouts, and sorting.
          - Manage OCR cache, reading controls, sharing, printing, page comments, and PDF copies.
          NOTES

          gh release create "v0.6.6" \
            "Kontho-PDF-Reader-v0.6.6.apk" \
            "APK-SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kontho PDF Reader 0.6.6" \
            --notes-file release-notes.md
